# 鬼骰 · 实时对战 —— 挂在 nginx 上的独立入口（不动你现有的站点）
# 用法：sudo cp 这份到 /etc/nginx/sites-available/dice-live
#       sudo ln -s /etc/nginx/sites-available/dice-live /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
# 朋友访问： https://101.34.71.12:8443/web/play.html   （腾讯云安全组要放行 8443）
#
# 证书沿用你 drama-https 用的那张；若该证书不含这个 IP，浏览器会告警，
# 想彻底干净就绑个域名再签一张（certbot --ip 不支持，得用域名）。
server {
    listen 8443 ssl;
    server_name 101.34.71.12;
    ssl_certificate     /etc/letsencrypt/live/subshift-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/subshift-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location / {
        proxy_pass http://127.0.0.1:18898;      # 牌桌服务只听 127.0.0.1，公网只走这里
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;                    # 事件流（SSE）必须：否则喊价会整批憋着不来
        proxy_cache off;
        proxy_read_timeout 300s;                # 比一手的思考时限长就行
        proxy_send_timeout 300s;
        client_max_body_size 2m;
    }
}
